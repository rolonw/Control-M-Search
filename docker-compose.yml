version: '3.8'

services:
  controlm-search-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlm-search-web
    # Publicar en todas las interfaces (0.0.0.0) para acceder desde 192.168.236.21
    ports:
      - "0.0.0.0:5000:5000"
    # Permitir que el contenedor alcance la IP de tu VM y la red local
    extra_hosts:
      - "vmhost:192.168.236.21"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-controlm-search-web-2024-change-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - PORT=5000
      - DB_TYPE=${DB_TYPE:-oracle}
    volumes:
      - ./data:/app/data
      - ./db_config.json:/app/db_config.json:ro
      - ./license.json:/app/license.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/about"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# - Acceso a la app: http://192.168.236.21:5000 (si 192.168.236.21 es la IP de esta VM).
# - Conexión desde el contenedor a 192.168.236.21: usa en db_config.json el host
#   "192.168.236.21" (o el nombre "vmhost") para la BD u otros servicios.
