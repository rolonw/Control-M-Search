{% extends "base.html" %}
{% block title %}Admin - Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Acceso de Administración</h5>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                {% if message %}
                <div class="alert alert-info">{{ message }}</div>
                {% endif %}
                <form method="post" action="{{ url_for('admin') }}">
                    <div class="mb-3">
                        <label for="admin_password" class="form-label">Contraseña:</label>
                        <input type="password" class="form-control" name="admin_password" id="admin_password" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Acceder</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{{ url_for('index') }}" class="text-muted small">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
