<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Control-M Search{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ctm-orange: #ffc080; --ctm-bg: #ffe0c0; }
        body { background: var(--ctm-bg); font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(180deg, #e67e22 0%, #d35400 100%); }
        .card, .form-control:focus { border-color: #e67e22; box-shadow: 0 0 0 0.2rem rgba(230, 126, 34, 0.25); }
        .btn-primary { background: #d35400; border-color: #d35400; }
        .btn-primary:hover { background: #e67e22; border-color: #e67e22; }
        .panel-datajob { background: var(--ctm-orange); border-radius: 8px; }
        .results-table { background: #fff; border-radius: 8px; overflow: hidden; }
        .results-table table { margin: 0; }
        .results-table th { background: #d35400; color: #fff; white-space: nowrap; }
        .results-table td, .results-table th { padding: 0.4rem 0.6rem; font-size: 0.9rem; }
        .count-msg { font-weight: bold; color: #333; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg mb-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index') }}">Control-M Search</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('consultas_avanzadas') }}">Consultas Avanzadas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('informes') }}">Informes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('node_groups') }}">Node Groups</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('variables_globales') }}">Variables Globales</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('export_csv') }}">Exportar a CSV</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container-fluid">
        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
