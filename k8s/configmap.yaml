apiVersion: v1
kind: ConfigMap
metadata:
  name: controlm-search-config
  labels:
    app: controlm-search-web
data:
  # Tipo de base de datos: oracle, mssql, postgresql
  db-type: "oracle"
  
  # Configuración de base de datos (db_config.json)
  # NOTA: Reemplaza estos valores con tu configuración real
  db_config.json: |
    {
      "db_type": "oracle",
      "ems": {
        "host": "oracle-ems.example.com",
        "port": 1521,
        "service_name": "ORCL",
        "sid": "",
        "tns": "",
        "user": "CTMEMS919WIN",
        "password": "CHANGE_ME",
        "database": "",
        "driver": ""
      },
      "ctm": {
        "host": "oracle-ctm.example.com",
        "port": 1521,
        "service_name": "ORCL",
        "sid": "",
        "tns": "",
        "user": "CTMSRV919WIN",
        "password": "CHANGE_ME",
        "database": "",
        "driver": ""
      }
    }
  
