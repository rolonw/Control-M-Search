apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: controlm-search-pvc
  labels:
    app: controlm-search-web
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: standard  # Descomentar y especificar según tu cluster
  # Si tu cluster tiene storage classes específicas, úsalas aquí
