apiVersion: v1
kind: Secret
metadata:
  name: controlm-search-secrets
  labels:
    app: controlm-search-web
type: Opaque
stringData:
  # Clave secreta de Flask (cambiar en producción)
  flask-secret-key: "controlm-search-web-2024-change-in-production"
  
  # Contraseña de administración (cambiar en producción)
  admin-password: "admin123"
  
  # Archivo de licencia (license.json)
  # NOTA: Reemplaza con tu archivo de licencia real
  # Puedes generarlo usando: python generate_license_key.py
  license.json: |
    {
      "valid_until": "2026-12-31",
      "activated": true
    }

---
# INSTRUCCIONES PARA CREAR SECRETOS:
#
# Opción 1: Crear desde archivo (recomendado)
#   kubectl create secret generic controlm-search-secrets \
#     --from-file=flask-secret-key=./secrets/flask-secret-key.txt \
#     --from-file=admin-password=./secrets/admin-password.txt \
#     --from-file=license.json=./license.json
#
# Opción 2: Crear desde literales
#   kubectl create secret generic controlm-search-secrets \
#     --from-literal=flask-secret-key='tu-clave-secreta-aqui' \
#     --from-literal=admin-password='tu-password-admin-aqui' \
#     --from-file=license.json=./license.json
#
# Opción 3: Usar este archivo (menos seguro, solo para desarrollo)
#   kubectl apply -f secrets.yaml
#
# IMPORTANTE: En producción, NO commits este archivo con valores reales.
# Usa kubectl create secret o herramientas como Sealed Secrets, External Secrets Operator, etc.
